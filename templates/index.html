<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeepResearcher - Flask Interface</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 30px 15px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid #e2e8f0;
    }
    h1 {
      margin-top: 0;
      color: #0f172a;
      font-size: 26px;
    }
    p.subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 25px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      color: #334155;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 15px;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    button {
      background-color: #2563eb;
      color: #ffffff;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .error-card {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 14px;
    }
    .report-card {
      margin-top: 30px;
      border-top: 2px solid #e2e8f0;
      padding-top: 20px;
    }
    .report-card h2 {
      font-size: 20px;
      color: #0f172a;
      margin-bottom: 15px;
    }
    .report-content {
      line-height: 1.7;
      color: #334155;
    }
    .report-content h1, .report-content h2, .report-content h3 {
      color: #0f172a;
      margin-top: 20px;
    }
    .report-content a {
      color: #2563eb;
    }
    .report-content pre {
      background: #0f172a;
      color: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
    }
    .report-content blockquote {
      border-left: 4px solid #2563eb;
      margin-left: 0;
      padding-left: 15px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 DeepResearcher</h1>
    <p class="subtitle">Autonomous AI Research Agent powered by Google ADK & Gemini Flash (Flask Interface)</p>

    <!-- Classic Flask Form -->
    <form method="POST" action="/">
      <label for="topic">Research Topic / Subject:</label>
      <textarea
        name="topic"
        id="topic"
        rows="3"
        placeholder="e.g. Latest trends in AI for Education 2026"
        required
      >{{ topic or '' }}</textarea>

      <button type="submit">Run Research Agent</button>
    </form>

    <!-- Error Message Display (Jinja2) -->
    {% if error %}
      <div class="error-card">
        <strong>Error:</strong> {{ error }}
      </div>
    {% endif %}

    <!-- Research Output Display (Jinja2) -->
    {% if report_html %}
      <div class="report-card">
        <h2>📑 Synthesized Research Report</h2>
        <div class="report-content">
          {{ report_html | safe }}
        </div>
      </div>
    {% endif %}

  </div>

</body>
</html>
